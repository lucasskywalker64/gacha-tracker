name: CI/CD Pipeline

on:
    push:
        branches:
            - "**"
    pull_request:
        branches:
            - "**"

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    ci:
        runs-on: ubuntu-latest
        env:
            PUBLIC_API_URL: "http://localhost:3000"
            PUBLIC_FRONTEND_URL: "http://localhost:5173"
        steps:
            - uses: actions/checkout@v6

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - run: bun install
            - run: bun run lint
            - run: bun run typecheck
            - name: Test
              run: bun run test
              env:
                  DATABASE_URL: "libsql://test.turso.io"
                  DATABASE_AUTH_TOKEN: "test"
                  REDIS_URL: "redis://localhost:6379"
                  BETTER_AUTH_URL: "http://localhost:3000"
                  BETTER_AUTH_SECRET: "test-secret-1234567890abcdefghijklmnopqrstuvwxyz"
                  DISCORD_CLIENT_ID: "test"
                  DISCORD_CLIENT_SECRET: "test"
                  GOOGLE_CLIENT_ID: "test"
                  GOOGLE_CLIENT_SECRET: "test"

    deploy-backend:
        environment: production
        needs: ci
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: Install cloudflared
              run: |
                  wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
                  sudo dpkg -i cloudflared-linux-amd64.deb

            - name: Setup SSH Key
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.SSH_KEY }}

            - name: Configure SSH Proxy
              run: |
                  mkdir -p ~/.ssh
                  echo "Host ${{ vars.HOST }}" >> ~/.ssh/config
                  echo "  ProxyCommand cloudflared access ssh --hostname %h" >> ~/.ssh/config
                  echo "  StrictHostKeyChecking no" >> ~/.ssh/config

            - name: Deploy to Raspberry Pi
              run: |
                  ssh ${{ vars.USER }}@${{ vars.HOST }} << 'EOF'
                    set -e

                    export PATH="$HOME/.bun/bin:$PATH"
                    cd ~/gacha-tracker

                    OLD_COMMIT=$(git rev-parse HEAD)
                    cp apps/api/.env apps/api/.env.backup || true

                    git fetch origin main
                    git reset --hard origin/main

                    echo "PORT=3000" > apps/api/.env.tmp
                    echo "DATABASE_URL=${{ vars.DATABASE_URL }}" >> apps/api/.env.tmp
                    echo "DATABASE_AUTH_TOKEN=${{ secrets.DATABASE_AUTH_TOKEN }}" >> apps/api/.env.tmp
                    echo "BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL }}" >> apps/api/.env.tmp
                    echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> apps/api/.env.tmp
                    echo "FRONTEND_URL=${{ vars.FRONTEND_URL }}" >> apps/api/.env.tmp
                    echo "DISCORD_CLIENT_ID=${{ vars.DISCORD_CLIENT_ID }}" >> apps/api/.env.tmp
                    echo "DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}" >> apps/api/.env.tmp
                    echo "GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}" >> apps/api/.env.tmp
                    echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> apps/api/.env.tmp
                    echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> apps/api/.env.tmp

                    mv apps/api/.env.tmp apps/api/.env

                    # Generate systemd service file from template
                    CURRENT_USER=$(whoami)
                    REPO_DIR=$(pwd)
                    BUN_PATH=$(which bun || echo "$HOME/.bun/bin/bun")
                    sed -e "s|{{USER}}|$CURRENT_USER|g" \
                        -e "s|{{WORKING_DIRECTORY}}|$REPO_DIR|g" \
                        -e "s|{{BUN_PATH}}|$BUN_PATH|g" \
                        -e "s|{{DESCRIPTION}}|Gacha Tracker API|g" \
                        -e "s|{{NODE_ENV}}|production|g" \
                        apps/api/gacha-api.service.template > apps/api/gacha-api.service

                    # Sync systemd service file
                    sudo cp apps/api/gacha-api.service /etc/systemd/system/gacha-api.service
                    sudo systemctl daemon-reload
                    sudo systemctl enable gacha-api.service

                    # Ensure Redis is running
                    sudo systemctl enable --now redis-server.service

                    bun install
                    bun --cwd apps/api run build
                    sudo systemctl restart gacha-api

                    sleep 5

                    if ! curl -sf http://localhost:3000/health > /dev/null; then
                      git reset --hard $OLD_COMMIT
                      mv apps/api/.env.backup apps/api/.env
                      CURRENT_USER=$(whoami)
                      REPO_DIR=$(pwd)
                      BUN_PATH=$(which bun || echo "$HOME/.bun/bin/bun")
                      sed -e "s|{{USER}}|$CURRENT_USER|g" \
                          -e "s|{{WORKING_DIRECTORY}}|$REPO_DIR|g" \
                          -e "s|{{BUN_PATH}}|$BUN_PATH|g" \
                          -e "s|{{DESCRIPTION}}|Gacha Tracker API|g" \
                          -e "s|{{NODE_ENV}}|production|g" \
                          apps/api/gacha-api.service.template > apps/api/gacha-api.service
                      sudo cp apps/api/gacha-api.service /etc/systemd/system/gacha-api.service
                      sudo systemctl daemon-reload
                      bun install
                      bun --cwd apps/api run build
                      sudo systemctl restart gacha-api
                      exit 1
                    fi

                    rm -f apps/api/.env.backup
                  EOF

    deploy-backend-dev:
        environment: development
        needs: ci
        if: github.ref == 'refs/heads/develop'
        runs-on: ubuntu-latest
        steps:
            - name: Install cloudflared
              run: |
                  wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
                  sudo dpkg -i cloudflared-linux-amd64.deb

            - name: Setup SSH Key
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.SSH_KEY }}

            - name: Configure SSH Proxy
              run: |
                  mkdir -p ~/.ssh
                  echo "Host ${{ vars.HOST }}" >> ~/.ssh/config
                  echo "  ProxyCommand cloudflared access ssh --hostname %h" >> ~/.ssh/config
                  echo "  StrictHostKeyChecking no" >> ~/.ssh/config

            - name: Deploy to Raspberry Pi (Dev)
              run: |
                  ssh ${{ vars.USER }}@${{ vars.HOST }} << 'EOF'
                    set -e

                    export PATH="$HOME/.bun/bin:$PATH"
                    cd ~/gacha-tracker-dev

                    OLD_COMMIT=$(git rev-parse HEAD)
                    cp apps/api/.env apps/api/.env.backup || true

                    git fetch origin develop
                    git reset --hard origin/develop

                    echo "PORT=3001" > apps/api/.env.tmp
                    echo "DATABASE_URL=file:./dev.db" >> apps/api/.env.tmp
                    echo "DATABASE_AUTH_TOKEN=dev-secret" >> apps/api/.env.tmp
                    echo "REDIS_URL=redis://localhost:6379/1" >> apps/api/.env.tmp
                    echo "BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL }}" >> apps/api/.env.tmp
                    echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> apps/api/.env.tmp
                    echo "FRONTEND_URL=${{ vars.FRONTEND_URL }}" >> apps/api/.env.tmp
                    echo "DISCORD_CLIENT_ID=${{ vars.DISCORD_CLIENT_ID }}" >> apps/api/.env.tmp
                    echo "DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}" >> apps/api/.env.tmp
                    echo "GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}" >> apps/api/.env.tmp
                    echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> apps/api/.env.tmp
                    echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> apps/api/.env.tmp

                    mv apps/api/.env.tmp apps/api/.env

                    # Generate systemd service file from template
                    CURRENT_USER=$(whoami)
                    REPO_DIR=$(pwd)
                    BUN_PATH=$(which bun || echo "$HOME/.bun/bin/bun")
                    sed -e "s|{{USER}}|$CURRENT_USER|g" \
                        -e "s|{{WORKING_DIRECTORY}}|$REPO_DIR|g" \
                        -e "s|{{BUN_PATH}}|$BUN_PATH|g" \
                        -e "s|{{DESCRIPTION}}|Gacha Tracker API Dev|g" \
                        -e "s|{{NODE_ENV}}|development|g" \
                        apps/api/gacha-api.service.template > apps/api/gacha-api-dev.service

                    # Sync systemd service file
                    sudo cp apps/api/gacha-api-dev.service /etc/systemd/system/gacha-api-dev.service
                    sudo systemctl daemon-reload
                    sudo systemctl enable gacha-api-dev.service

                    # Ensure Redis is running
                    sudo systemctl enable --now redis-server.service

                    bun install
                    bun --cwd apps/api run build
                    sudo systemctl restart gacha-api-dev

                    sleep 5

                    if ! curl -sf http://localhost:3001/health > /dev/null; then
                      git reset --hard $OLD_COMMIT
                      mv apps/api/.env.backup apps/api/.env
                      CURRENT_USER=$(whoami)
                      REPO_DIR=$(pwd)
                      BUN_PATH=$(which bun || echo "$HOME/.bun/bin/bun")
                      sed -e "s|{{USER}}|$CURRENT_USER|g" \
                          -e "s|{{WORKING_DIRECTORY}}|$REPO_DIR|g" \
                          -e "s|{{BUN_PATH}}|$BUN_PATH|g" \
                          -e "s|{{DESCRIPTION}}|Gacha Tracker API Dev|g" \
                          -e "s|{{NODE_ENV}}|development|g" \
                          apps/api/gacha-api.service.template > apps/api/gacha-api-dev.service
                      sudo cp apps/api/gacha-api-dev.service /etc/systemd/system/gacha-api-dev.service
                      sudo systemctl daemon-reload
                      bun install
                      bun --cwd apps/api run build
                      sudo systemctl restart gacha-api-dev
                      exit 1
                    fi

                    rm -f apps/api/.env.backup
                  EOF
