name: Bug Report
description: Create a report to help us reproduce and fix a bug in gacha-tracker
title: "[Bug]: "
labels: ["type: bug"]
body:
    - type: markdown
      attributes:
          value: |
              Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem.

    - type: dropdown
      id: game
      attributes:
          label: Affected Game
          description: Which game is this issue related to?
          options:
              - Genshin Impact
              - Honkai: Star Rail
              - Zenless Zone Zero
              - Wuthering Waves
              - All / Multiple Games
              - None / Not Applicable
      validations:
          required: true

    - type: dropdown
      id: component
      attributes:
          label: Component / Module
          description: Where did you encounter this issue?
          options:
              - Web Dashboard (UI)
              - Wish History Import / Script
              - Statistics & Analytics
              - API & Backend
              - User Account / Authentication
              - Other
      validations:
          required: true

    - type: textarea
      id: description
      attributes:
          label: Bug Description
          description: A clear and concise description of what the bug is.
          placeholder: Describe what happened...
      validations:
          required: true

    - type: textarea
      id: reproduce
      attributes:
          label: Steps to Reproduce
          description: Steps to reproduce the behavior.
          placeholder: |
              1. Go to '...'
              2. Click on '...'
              3. Scroll down to '...'
              4. See error
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected Behavior
          description: A clear description of what you expected to happen.
      validations:
          required: true

    - type: textarea
      id: screenshots-logs
      attributes:
          label: Screenshots & Error Logs
          description: Drag and drop any screenshots, browser console logs, or terminal output here.
          placeholder: Paste console output or attach screenshots here...

    - type: input
      id: environment
      attributes:
          label: Environment Details
          description: Operating System, Browser (e.g. Chrome, Firefox, Safari), or Bun version if running locally.
          placeholder: e.g. Windows 11, Chrome 125, Bun 1.1.0

    - type: checkboxes
      id: checks
      attributes:
          label: Checklist
          options:
              - label: I have searched existing issues to ensure this is not a duplicate.
                required: true
